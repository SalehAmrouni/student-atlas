<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Applications | Student Atlas</title>
  <meta name="description" content="Track the opportunities you have applied to, see deadlines and events on a calendar, and send your list to a parent or counselor.">
  <meta name="theme-color" content="#0e9f6e">
  <link rel="icon" type="image/png" href="/image/icon.png">
  <link rel="stylesheet" href="/css/app.css">
  <script src="/js/theme-init.js"></script>
  <script src="/js/auth-gate.js"></script>
  <script src="/vendor/lucide/lucide.min.js" defer></script>
  <script type="module" src="/js/pages/tracker.js"></script>
</head>
<body>
  <main id="main" tabindex="-1">
    <div class="container section-tight">
      <div class="row-between mb-3 page-head">
        <div>
          <span class="eyebrow">My Applications</span>
          <h1 class="mb-0">Application tracker</h1>
          <p class="muted mb-0 mt-1">What you’ve applied to, what’s due, and what’s coming up. Saved only in this browser.</p>
        </div>
        <div class="row page-actions" id="tracker-actions"></div>
      </div>
      <div id="tracker-root"><div class="skeleton"></div></div>
    </div>
  </main>
</body>
</html>
