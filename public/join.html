<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join your class or sign in | Student Atlas</title>
  <meta name="description" content="Join your teacher's Student Atlas room with a room code, or sign in with your Atlas username.">
  <meta name="theme-color" content="#0e9f6e">
  <link rel="icon" type="image/png" href="/image/icon.png">
  <link rel="stylesheet" href="/css/app.css">
  <script src="/js/theme-init.js"></script>
  <script src="/vendor/lucide/lucide.min.js" defer></script>
  <script type="module" src="/js/pages/join.js"></script>
</head>
<body>
  <main id="main" tabindex="-1">
    <div class="container container-narrow section-tight">
      <span class="eyebrow">Student Atlas</span>
      <h1 id="join-title">Join your class</h1>
      <p class="lead" id="join-lead">Type the room code your teacher or counselor gave you. You’ll get a random Atlas username, and your progress saves automatically.</p>
      <div id="join-root"></div>
    </div>
  </main>
</body>
</html>
